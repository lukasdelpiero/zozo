# ZoZo (web) — configuração do Cloudflare (Python Workers + D1)
#
# Dois ambientes, com banco e endereço SEPARADOS:
#   PRODUÇÃO  (usuários)    uv run pywrangler deploy               → https://zozo.zozo-finance-app.workers.dev
#   PRÉVIA    (só testes)   uv run pywrangler deploy --env previa  → https://zozo-previa.zozo-finance-app.workers.dev
# Teste na prévia primeiro; só depois publique em produção.
#
# Segredos (NUNCA neste arquivo) — uma vez por ambiente:
#   npx wrangler secret put SEGREDO                       (e: --env previa)
#   npx wrangler secret put TURNSTILE_SECRET              (e: --env previa)
name = "zozo"
main = "src/entry.py"
compatibility_date = "2026-10-01"
compatibility_flags = ["python_workers"]

# Endereço: workers.dev. As URLs de pré-visualização por versão ficam desligadas
# (a prévia oficial é o ambiente "previa", protegido pelo Cloudflare Access).
workers_dev = true
preview_urls = false

# Logs do Worker (eventos de segurança, sem senhas, e-mails ou IPs em texto)
[observability]
enabled = true

# Interface (pasta gerada por: python montar_interface.py)
# Os arquivos são servidos direto pelo Cloudflare; só /api/* chega ao Python.
[assets]
directory = "./public"
not_found_handling = "none"

# Banco SQL de PRODUÇÃO. Tabelas: npx wrangler d1 migrations apply zozo --remote
[[d1_databases]]
binding = "DB"
database_name = "zozo"
database_id = "7964c186-da78-4c07-942c-79d583691f75"
migrations_dir = "migracoes"

[vars]
# Quem pode CRIAR conta (separados por vírgula). "*" = cadastro aberto a qualquer pessoa.
ALLOWED_EMAILS = "lukas.delpiero@outlook.com.br,lk-cat2@hotmail.com,cibelecamargospp@gmail.com"
# CAPTCHA (chave pública; a secreta é o segredo TURNSTILE_SECRET)
TURNSTILE_SITE_KEY = "0x4AAAAAAFQjiDFKjsHDDIAe"

# ================= PRÉVIA (testes antes de publicar) =================
# Só o e-mail de ACCESS_EMAILS passa pelo Cloudflare Access na frente do site,
# e só o de ALLOWED_EMAILS pode criar a conta do ZoZo lá dentro.
[env.previa]
name = "zozo-previa"
workers_dev = true
preview_urls = false

[env.previa.observability]
enabled = true

[[env.previa.d1_databases]]
binding = "DB"
database_name = "zozo-previa"
database_id = "d267ce2a-3920-4c7b-8e91-7b3990dba0ba"
migrations_dir = "migracoes"

[env.previa.vars]
ALLOWED_EMAILS = "insight@usezozo.com.br"
TURNSTILE_SITE_KEY = "0x4AAAAAAFQjiDFKjsHDDIAe"
EXIGIR_ACCESS = "1"
ACCESS_TEAM_DOMAIN = "zozo-finance-app.cloudflareaccess.com"
ACCESS_EMAILS = "testenviroment@usezozo.com.br"
# Cole aqui o "Application Audience (AUD) Tag" da aplicação do Access da prévia.
# Enquanto estiver assim, a API da prévia recusa tudo (falha fechada).
ACCESS_AUD = "COLE-AQUI-O-AUD-DA-PREVIA"
