# Backup diário do banco de produção (D1 "zozo"), independente do Cloudflare.
# O export (e-mails legíveis + documentos cifrados) é conferido e cifrado com age ANTES de sair do runner:
# só a chave PÚBLICA fica no GitHub; a privada fica com o dono, fora do computador de trabalho.
# Restauração: docs/RESTAURACAO.md ("Backup automático").
#
# Segredos do repositório (Settings → Secrets and variables → Actions):
#   CLOUDFLARE_API_TOKEN   token da conta (Account API tokens) com só "D1 Write" (o export do D1 exige escrita)
#   CLOUDFLARE_ACCOUNT_ID  id da conta
#   BACKUP_AGE_RECIPIENT   chave pública do age (age1…)
# Opcional — cópia também numa nuvem sua (Google Drive, Dropbox, Backblaze B2, OneDrive…), pelo rclone:
#   RCLONE_CONFIG          conteúdo do rclone.conf com UM remoto (gerado no seu computador: rclone config)
#   RCLONE_DESTINO         remoto:pasta, ex.: gdrive:ZoZo-backups
# O que vai para a nuvem é o mesmo .sql.age (cifrado): sem a chave PRIVADA do age, ninguém abre.
# Passo a passo: docs/RESTAURACAO.md, seção 0.
name: Backup do banco (D1)

# DESLIGADO por enquanto: só roda à mão (Actions → Run workflow). Para o backup diário, depois de
# cadastrar os segredos, descomente as 2 linhas de "schedule" (03:17 em Brasília).
on:
  # schedule:
  #   - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-d1
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      TEM_NUVEM: ${{ secrets.RCLONE_CONFIG != '' && 'sim' || 'nao' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1   # v7.0.1
        with:
          persist-credentials: false

      - name: Conferir segredos
        env:
          TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CONTA: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          DESTINO: ${{ secrets.BACKUP_AGE_RECIPIENT }}
        run: |
          [ -n "$TOKEN" ] && [ -n "$CONTA" ] || { echo "::error::Faltam CLOUDFLARE_API_TOKEN / CLOUDFLARE_ACCOUNT_ID"; exit 1; }
          case "$DESTINO" in age1*) ;; *) echo "::error::BACKUP_AGE_RECIPIENT não é uma chave pública do age"; exit 1;; esac

      - name: Instalar age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age

      - name: Exportar, conferir e cifrar
        working-directory: api
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          BACKUP_AGE_RECIPIENT: ${{ secrets.BACKUP_AGE_RECIPIENT }}
          WRANGLER_SEND_METRICS: "false"
        run: |
          set -euo pipefail
          umask 077
          dia=$(date -u +%Y-%m-%d)
          plano="$RUNNER_TEMP/zozo-$dia.sql"
          npx --yes wrangler@4.148.0 d1 export zozo --remote --output "$plano"
          # mesma conferência do procedimento manual (só contagens; não imprime e-mails nem conteúdo)
          python3 -I dev/conferir_backup.py "$plano" "$RUNNER_TEMP/conferencia.db"
          mkdir -p "$RUNNER_TEMP/saida"
          age -r "$BACKUP_AGE_RECIPIENT" -o "$RUNNER_TEMP/saida/zozo-$dia.sql.age" "$plano"
          shred -u "$plano" "$RUNNER_TEMP/conferencia.db"
          ls -l "$RUNNER_TEMP/saida"

      - name: Copiar para a nuvem (opcional, rclone)
        if: env.TEM_NUVEM == 'sim'
        env:
          CONF: ${{ secrets.RCLONE_CONFIG }}
          DESTINO: ${{ secrets.RCLONE_DESTINO }}
        run: |
          set -euo pipefail
          umask 077
          case "$DESTINO" in *:*) ;; *) echo "::error::RCLONE_DESTINO precisa ser remoto:pasta (ex.: gdrive:ZoZo-backups)"; exit 1;; esac
          cd "$RUNNER_TEMP"
          # rclone com versão e hash fixos (o hash é o publicado em SHA256SUMS da versão)
          curl -fsSL -o rclone.zip https://github.com/rclone/rclone/releases/download/v1.75.2/rclone-v1.75.2-linux-amd64.zip
          echo "349ac8fba6ff65d6247043f1750cdcb518ec5d500ef91463a10d37c0ccdf3702  rclone.zip" | sha256sum -c -
          unzip -q -j rclone.zip '*/rclone' -d bin
          printf '%s\n' "$CONF" > rclone.conf
          trap 'shred -u rclone.conf 2>/dev/null || true' EXIT
          # só acrescenta: um backup que já está lá (ex.: rodou duas vezes no mesmo dia) não é sobrescrito
          bin/rclone --config rclone.conf copy saida/ "$DESTINO" --ignore-existing --no-traverse --stats-one-line
          # na nuvem ficam 90 dias de backups (só os arquivos zozo-*.sql.age)
          bin/rclone --config rclone.conf delete "$DESTINO" --min-age 90d --include "zozo-*.sql.age"
          bin/rclone --config rclone.conf lsl "$DESTINO" --include "zozo-*.sql.age" | tail -n 3

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9   # v7.0.2
        with:
          name: zozo-backup-${{ github.run_id }}
          path: ${{ runner.temp }}/saida/*.sql.age
          retention-days: 30
          if-no-files-found: error
          compression-level: 0     # já cifrado: não comprime
