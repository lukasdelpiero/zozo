<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self' 'wasm-unsafe-eval' https://challenges.cloudflare.com; style-src 'self'; img-src 'self' data:; font-src 'self'; connect-src 'self'; frame-src https://challenges.cloudflare.com; object-src 'none'; base-uri 'none'; form-action 'none'">
  <title>ZoZo</title>
  <link rel="icon" type="image/svg+xml" href="/assets/img/favicon.svg">
  <link rel="alternate icon" type="image/png" href="/assets/img/favicon.png">
</head>
<body>
  <div id="app" class="tw:h-full" data-auth="loading">
    <div id="auth-root" class="tw:in-data-[auth=authenticated]:hidden"></div>
    <!-- Estrutura (Tailwind): menu lateral | [barra superior + área principal] | painel. data-menu="recolhido" e
         data-gaveta="aberta" (celular) mudam o layout; as classes de cada parte estão em components/estrutura.js -->
    <div id="shell" class="tw:group/shell tw:relative tw:hidden tw:in-data-[auth=authenticated]:grid tw:grid-cols-[var(--sidebar-width)_minmax(0,1fr)] tw:h-full tw:min-w-0 tw:[transition:grid-template-columns_var(--duration-medium)_var(--easing)] tw:data-[menu=recolhido]:grid-cols-[0_minmax(0,1fr)] tw:gaveta:grid-cols-[minmax(0,1fr)] tw:gaveta:data-[menu=recolhido]:grid-cols-[minmax(0,1fr)] tw:motion-reduce:transition-none!"></div>
    <div id="boleto-root"></div>
    <div id="modal-root"></div>
    <div id="toast-root" aria-live="polite"></div>
  </div>

  <!-- Interface (Vite): estilos e scripts em ordem, ver src/main.ts. O modo de demonstração (?mock=1)
       só existe no servidor de desenvolvimento (npm run dev); o build nunca o inclui. -->
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
